name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  # 1. Guard: nothing ships unless analysis and tests pass.
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install SQLite (sqflite_common_ffi on Linux)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test

  # 2. Build both first-class platforms.
  build-android:
    name: Build Android APK
    needs: [ test ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release
      - name: Stage APK with versioned name
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/IELTS-Free-Android-v${VERSION}.apk"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/IELTS-Free-Android-v*.apk
          if-no-files-found: error

  build-windows:
    name: Build Windows
    needs: [ test ]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows release
        run: flutter build windows --release
      - name: Stage Windows bundle with versioned name
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v',''
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "dist/IELTS-Free-Windows-v$version.zip"
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/IELTS-Free-Windows-v*.zip
          if-no-files-found: error

  # 3. Checksums + GitHub Release.
  release:
    name: Publish Release
    needs: [ build-android, build-windows ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate SHA256SUMS.txt
        run: |
          cd artifacts
          find . -type f \( -name '*.apk' -o -name '*.zip' \) -exec sha256sum {} \; \
            | sed 's#\./##' | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: IELTS Free ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          files: |
            artifacts/**/*.apk
            artifacts/**/*.zip
            artifacts/SHA256SUMS.txt
