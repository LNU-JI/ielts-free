name: Android Build

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore release keystore
        # Why this step exists: without a stable signing key the runner signs the
        # APK with a *freshly generated debug key* every time, so each release has
        # a different signature. Android then refuses to install it over the
        # previous version, forcing users to uninstall first — which wipes their
        # entire on-device study database. We restore the single, permanent
        # release key from repository secrets so upgrades keep working.
        #
        # The guard lives inside the shell rather than in a step-level `if`,
        # because the `secrets` context is not available to `if` expressions and
        # using it there makes the whole workflow fail to compile. Skipping the
        # step when the secret is absent keeps forks and pull requests building
        # with debug signing instead of failing.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, so this build falls back to debug signing. An APK signed this way cannot be installed over a previously released one."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/ielts-free-release.p12
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "ielts-free-release.p12" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
            > android/key.properties

      # No code generation (Route B). Straight to build.
      # Split per ABI: one APK per architecture instead of one fat APK carrying
      # all three native library sets. Roughly a third of the size each.
      - name: Build release APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ielts-free-android-apk
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
